<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/todo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Web to-do list gonsanto</title>
</head>

<body>
  <main class="background">
    <h1>Web to-do list app</h1>
    <div style="display: flex;">
      <div class="interface">
        <h2>Todos</h2>
        <p id="overdue-message"></p>
        <div>
          <p id="todo-error"></p>
          <div class="input-container">
            <input type="text" id="todo-input" name="input prompt" />
            <input type="date" id="todo-date-input" />
            <button type="button" id="add-todo-button" name="add todo button">add</button>
          </div>
        </div>
        <ul id="todo-list" name="list of elements"></ul>
      </div>
      <div class="interface">
        <h2>Categories</h2>
        <p id="overdue-message"></p>
        <div>
          <p id="category-error"></p>
          <div class="input-container">
            <input type="text" id="category-name-input" name="input prompt" />
            <input type="color" id="category-color-input" />
            <button type="button" id="add-category-button" name="add category button">add</button>
          </div>
        </div>
        <ul id="category-list" name="list of categories"></ul>
      </div>
    </div>
    <button type="reset" id="delete-all">Delete All</button>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
